<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pneumonia Detection System</title>

    <!-- ============================================
         CSS - Medical Website Design
    ============================================= -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf6ff, #f7fbff);
            min-height: 100vh;
            color: #1e293b;
        }

        /* ============================================
           Main Container
        ============================================= */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        /* ============================================
           Header
        ============================================= */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0f5b9d;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 17px;
        }

        /* ============================================
           Main Card
        ============================================= */

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(15, 91, 157, 0.12);
            text-align: center;
        }

        /* ============================================
           Upload Section
        ============================================= */

        .upload-box {
            border: 2px dashed #4da3df;
            background: #f5fbff;
            padding: 30px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .upload-box h2 {
            color: #0f5b9d;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .upload-box p {
            color: #64748b;
            margin-bottom: 20px;
        }

        /* ============================================
           File Input
        ============================================= */

        input[type="file"] {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        /* ============================================
           Image Preview
        ============================================= */

        .preview-container {
            margin-top: 25px;
        }

        .preview-container h3 {
            color: #334155;
            margin-bottom: 12px;
        }

        #preview {
            display: none;
            width: 100%;
            max-width: 500px;
            max-height: 450px;
            object-fit: contain;
            margin: auto;
            border-radius: 15px;
            border: 3px solid #dbeafe;
            padding: 8px;
            background: #f8fafc;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* ============================================
           Analyze Button
        ============================================= */

        .analyze-btn {
            margin-top: 25px;
            width: 100%;
            max-width: 300px;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #0f5b9d;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .analyze-btn:hover {
            background: #084579;
            transform: translateY(-2px);
        }

        /* ============================================
           Prediction Result
        ============================================= */

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background: #eff6ff;
            border-left: 5px solid #0f5b9d;
        }

        .result h2 {
            color: #0f5b9d;
            font-size: 22px;
        }

        /* ============================================
           Footer
        ============================================= */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        /* ============================================
           Responsive Design
        ============================================= */

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 15px;
            }

            .upload-box {
                padding: 25px 15px;
            }
        }

    </style>
</head>


<body>

    <!-- ============================================
         Main Container
    ============================================= -->

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🩺 Pneumonia Detection</h1>
            <p>AI-Based Chest X-Ray Analysis System</p>
        </div>


        <!-- Main Card -->
        <div class="card">

            <!-- ========================================
                 Image Upload Section
            ========================================= -->

            <div class="upload-box">

                <h2>Upload Chest X-Ray</h2>

                <p>
                    Select a chest X-ray image to analyze
                </p>

                <form method="POST" enctype="multipart/form-data">

                    <!-- Image Upload -->
                    <input
                        type="file"
                        name="image"
                        id="imageInput"
                        accept="image/*"
                        required
                    >


                    <!-- ====================================
                         Image Preview
                    ===================================== -->

                    <div class="preview-container">

                        <h3 id="previewTitle" style="display:none;">
                            X-Ray Preview
                        </h3>

                        <img
                            id="preview"
                            src="#"
                            alt="X-ray Preview"
                        >

                    </div>


                    <!-- Analyze Button -->
                    <button
                        type="submit"
                        class="analyze-btn"
                    >
                        Analyze X-Ray
                    </button>

                </form>

            </div>


            <!-- ============================================
                 Prediction Result
            ============================================= -->

            {% if result %}

            <div class="result">

                <h2>
                    Prediction: {{ result }}
                </h2>

            </div>

            {% endif %}

        </div>


        <!-- Footer -->
        <div class="footer">

            <p>
                Pneumonia Detection System | AI Project | © 2026 Md. Habib Khan
            </p>

        </div>

    </div>

    <!-- ============================================
         JavaScript - X-Ray Image Preview
    ============================================= -->

    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const previewTitle = document.getElementById("previewTitle");

        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                preview.src = URL.createObjectURL(file);

                preview.style.display = "block";

                previewTitle.style.display = "block";
            }

        });

    </script>

</body>
</html>
```
